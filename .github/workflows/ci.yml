name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup (installer decision tests)
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Build net48 + net461, x86 + x64
        shell: pwsh
        run: |
          foreach ($p in 'x86','x64') { dotnet build HTISORipper.sln -c Release -p:Platform=$p -nologo; if ($LASTEXITCODE) { exit 1 } }

      - name: Test (unit tests on net48 and net462, installer decision tests)
        shell: pwsh
        env:
          ISCC_PATH: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
        run: dotnet test HTISORipper.sln -c Release -nologo --logger "trx" --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  installer-end-to-end:
    # Real installation on a clean Windows machine (administrator, no UAC prompt): install, check files,
    # registration, build and architecture, start the program, reinstall in place, uninstall.
    needs: build-and-test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Build Release x86 + x64
        shell: pwsh
        run: |
          foreach ($p in 'x86','x64') { dotnet build HTISORipper.sln -c Release -p:Platform=$p -nologo -v q; if ($LASTEXITCODE) { exit 1 } }

      - name: Compile the online installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /Q "/DOutputRoot=$PWD\release\ci" installer\HTISORipper.iss
          if ($LASTEXITCODE) { exit 1 }

      - name: Install, start, reinstall and uninstall (Windows PowerShell 5.1, as a tester would)
        shell: powershell
        run: |
          $setup = (Get-ChildItem release\ci\online\HT-ISO-Ripper-Setup-*.exe | Select-Object -First 1).FullName
          .\scripts\test-installer-e2e.ps1 -Setup $setup -Report e2e-report.txt
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-e2e-report
          path: |
            e2e-report.txt
            htisoripper-setup-*.log
