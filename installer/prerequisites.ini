; HT ISO Ripper - prerequisite manifest (version 1).
;
; This file is the single source of truth for every package Setup may download or bundle.
; Url, FileName, SizeBytes, SHA256 and SignerThumbprint are written by scripts\pin-prerequisites.ps1, which
;   1. resolves the official Microsoft fwlink below to its final https://download.microsoft.com URL,
;   2. downloads the package,
;   3. requires a valid Authenticode signature from O=Microsoft Corporation,
;   4. records the SHA-256.
; Setup refuses to run any package whose SHA-256 does not match this file. Setup never scrapes web pages.
; Visual C++ redistributables are intentionally absent: HT ISO Ripper contains no native code (see docs\PREREQUISITES.md).

